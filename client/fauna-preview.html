<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preview ballena ASCII</title>
    <style>
      html, body { margin: 0; background: #9fd4e6; font-family: system-ui, sans-serif; color: #1a3344; }
      main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { font-size: 18px; margin: 0 0 6px; }
      p { margin: 0 0 14px; color: #3d5a6c; font-size: 14px; }
      section { margin-bottom: 28px; }
      h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; color: #1e4458; }
      .frame {
        border: 1px solid rgba(255,255,255,0.5);
        border-radius: 12px;
        overflow: hidden;
        background: #c5e8f2;
        height: 420px;
      }
      .frame.tall { height: 560px; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <main>
      <h1>Preview — Ballena franca austral</h1>
      <p>Océano + variantes. Arriba quietas, abajo nadando por todo el frame.</p>
      <section>
        <h2>Variantes quietas</h2>
        <div class="frame tall"><canvas id="still" aria-hidden="true"></canvas></div>
      </section>
      <section>
        <h2>En movimiento</h2>
        <div class="frame"><canvas id="move" aria-hidden="true"></canvas></div>
      </section>
    </main>
    <script type="module" src="/src/fauna-preview.js"></script>
  </body>
</html>
